{% extends "base.html" %}

{% block title %}
    Create a new Meetup
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create a meetup for {{ trip.name }}</h1>
    <p class="subtitle">
        Plan a Meetup with your trip group.
    </p>
</div>

<form method="post" class="form-card">

    <div class="form-group">
        <label for="location">Location</label>
        <input type="text"
               id="location"
               name="location"
               required>
    </div>


    <div class="form-group">
        <label for="meet_time">Meeting Time</label>
        <input type="datetime-local" id="meet_time" name="meet_time">
    </div>


    <button type="submit">
        Create trip
    </button>
</form>

<p>
    <a href="{{ url_for('main.index') }}">← Back to all trips</a>
</p>
{% endblock %}
