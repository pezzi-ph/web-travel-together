{% extends "base.html" %}

{% block title %}Create a new trip – TasteTogether{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create a new food trip</h1>
    <p class="subtitle">
        Plan a TasteTogether adventure with other food lovers.
    </p>
</div>

<form method="post" class="form-card">
    <div class="form-group">
        <label for="name">Trip name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="departure">Departure city</label>
        <input type="text" id="departure" name="departure" required>
    </div>

    <div class="form-group">
        <label for="destination">Destination city</label>
        <input type="text" id="destination" name="destination" required>
    </div>

    <div class="form-group">
        <label for="budget">Approx. budget (EUR)</label>
        <input type="number" id="budget" name="budget" min="0" step="50">
    </div>

    <div class="form-group">
        <label for="max_members">Maximum participants</label>
        <input type="number" id="max_members" name="max_members" min="1" required>
    </div>

    <button type="submit">Create trip</button>
</form>

<p>
    <a href="{{ url_for('main.index') }}">← Back to all trips</a>
</p>
{% endblock %}
