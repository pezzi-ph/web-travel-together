{% extends "base.html" %}
{% block content %}
<h2>Create Trip</h2>
<form method="post">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Budget in €:</label><br>
    <input type="number" name="budget" required><br><br>

    <label>Maximum amount of members allowed:</label><br>
    <input type="number" name="maxMembers" required><br><br>

    <button type="submit">Create Trip</button>
</form>
{% endblock %}
